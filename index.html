<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AI名片管家">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>AI 名片管家 V0.2</title>
</head>
<body>
<div id="app">
<header class="topbar">

  <button class="icon-btn" id="settingsBtn">⚙️</button>

<main id="screen"></main>
<nav class="tabbar">

  <button id="addBtn" class="add-tab">＋</button>
  <button data-tab="categories" class="tab">🏷️<span>分類</span></button>
  <button data-tab="settings" class="tab">⚙️<span>設定</span></button>
</nav>
</div>
<div id="modalRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="app.js"></script>

</html>
